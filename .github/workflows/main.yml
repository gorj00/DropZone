name: main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: gorol-saas-projects
  REGION: europe-west4
  IMAGE: europe-west4-docker.pkg.dev/gorol-saas-projects/apps/dropzone-api
  WIF_PROVIDER: projects/258611697847/locations/global/workloadIdentityPools/github/providers/dropzone
  DEPLOYER: github-deployer@gorol-saas-projects.iam.gserviceaccount.com

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
      - run: npm run build:admin

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run android:prod
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
        working-directory: frontend/android

  deploy-dev:
    needs: [backend, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - run: |
          docker build --build-arg "GIT_SHA=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:dev" backend
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:dev"
      - run: gcloud run deploy dropzone-api-dev --project "$PROJECT" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" --quiet
