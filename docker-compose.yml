services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dropzone
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres16-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropzone -d dropzone"]
      interval: 5s
      timeout: 5s
      retries: 20

  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /data/dropzone-local && exec /bin/fake-gcs-server -data /data -scheme http -port 4443 -public-host localhost:4443
    ports:
      - "${GCS_PORT:-4443}:4443"
    volumes:
      - gcs-data:/storage

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      gcs:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dropzone
      DB_USER: dropzone
      DB_PASSWORD: dropzone
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GCS_BUCKET: dropzone-local
      GCS_ENDPOINT: http://gcs:4443
      GCS_PUBLIC_BASE_URL: http://localhost:4443/dropzone-local
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-dev-webhook-secret}
      REVENUECAT_API_KEY: ${REVENUECAT_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      DEV_LOGIN: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres16-data:
  gcs-data:
